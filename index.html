<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a5a">
  <title>Kalorietracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Kalorietracker</div>
    <button id="profileBtn" class="profile-chip" type="button" aria-label="Skift profil">
      <span id="profileInitial" class="avatar">?</span>
      <span id="profileName">Profil</span>
    </button>
  </header>

  <main id="app">
    <!-- Views renderes af app.js -->
    <section id="view-today" class="view" hidden></section>
    <section id="view-nutrition" class="view" hidden></section>
    <section id="view-weight" class="view" hidden></section>
    <section id="view-profile" class="view" hidden></section>
    <section id="view-onboarding" class="view" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="today" class="active" type="button"><span class="ico">🍽️</span><span>Dagbog</span></button>
    <button data-view="nutrition" type="button"><span class="ico">🧪</span><span>Næring</span></button>
    <button data-view="weight" type="button"><span class="ico">⚖️</span><span>Vægt</span></button>
    <button data-view="profile" type="button"><span class="ico">👤</span><span>Profil</span></button>
  </nav>

  <dialog id="modal">
    <div class="modal-inner">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Luk">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
